name: Pratica 06 - Testes

on:
  pull_request:
    branches: [main]
    paths:
      - 'praticas/pratica06/**'
      - '.github/workflows/pratica06.yml'
  push:
    branches: [pratica-06]

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: praticas/pratica06
    steps:
      - uses: actions/checkout@v4
      - name: Compilar pelo Makefile e executar os testes
        run: make test
      - name: Compilar com o comando do validador e conferir o caminho
        run: |
          gcc -Wall -Wextra -Werror -std=c11 *.c -o main -lm
          ./main > resultado.txt
          cat resultado.txt
          grep -Fx 'Caminho minimo 0 a 5 (custo 5): 0 -> 2 -> 4 -> 3 -> 5' resultado.txt
          grep -Fx 'Todos os testes passaram.' resultado.txt
      - name: Verificar memoria e comportamento indefinido
        run: |
          gcc -Wall -Wextra -Werror -std=c11 -g -fsanitize=address,undefined *.c -o main-sanitized -lm
          ASAN_OPTIONS=detect_leaks=1 ./main-sanitized
